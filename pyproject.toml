[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proofstate"
version = "0.3.0"
description = "Fail-closed verification of repository readiness evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tovellan contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
]

[project.urls]
Documentation = "https://github.com/tovellan/proofstate/tree/main/docs"
Issues = "https://github.com/tovellan/proofstate/issues"
Repository = "https://github.com/tovellan/proofstate"

[project.scripts]
proofstate = "proofstate.cli:main"

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "hypothesis>=6.124,<7",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofstate"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "performance: bounded performance regression checks",
]

[tool.coverage.run]
branch = true
source = ["proofstate"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["proofstate"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]
"scripts/**" = ["S603"]
"examples/**" = ["S603"]
