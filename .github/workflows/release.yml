name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, for example vX.Y.Z
        required: true
        type: string
      confirm:
        description: Confirm creation of a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Validate and create GitHub release
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          test "$(git rev-parse "$tag_ref^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Preflight source tree
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_distribution.py --source-only
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate source and tests
        run: |
          python3 scripts/verify_release.py --tag "$RELEASE_TAG"
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/proofstate tests
          uv run pytest --cov=proofstate --cov-report=term-missing
      - name: Build distributions
        run: make build
      - name: Verify release artifact versions
        run: python3 scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify both installed distributions
        run: |
          uv venv --python 3.11 wheel-env
          uv pip install --python wheel-env/bin/python dist/proofstate-*.whl
          wheel-env/bin/proofstate --version
          wheel-env/bin/proofstate conformance
          wheel-env/bin/proofstate conformance --export wheel-conformance
          uv venv --python 3.11 sdist-env
          uv pip install --python sdist-env/bin/python dist/proofstate-*.tar.gz
          sdist-env/bin/proofstate --version
          sdist-env/bin/proofstate conformance
          sdist-env/bin/proofstate conformance --export sdist-conformance
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/proofstate-*.whl
            ${{ github.workspace }}/dist/proofstate-*.tar.gz
          push-to-registry: false
      # Organization owner enforcement keeps immutable releases enabled for this
      # selected repository. This token intentionally has no Administration access.
      - name: Create draft release without publishing packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/release-notes/${version}.md"
          wheel="dist/proofstate-${version}-py3-none-any.whl"
          sdist="dist/proofstate-${version}.tar.gz"
          test -f "$notes"
          test -f "$wheel"
          test -f "$sdist"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_ref_json="$RUNNER_TEMP/proofstate-prepublish-tag-ref.json"
          tag_object_json="$RUNNER_TEMP/proofstate-prepublish-tag-object.json"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "ProofState $version" \
            --notes-file "$notes"
          gh release upload "$RELEASE_TAG" "$wheel" "$sdist" \
            --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$tag_ref_json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$tag_object_json"
          python3 scripts/verify_published_release.py \
            --tag-ref-json "$tag_ref_json" \
            --tag-object-json "$tag_object_json" \
            --tag "$RELEASE_TAG" \
            --tag-object "$tag_object" \
            --commit "$GITHUB_SHA" \
            --remote-tag-only
          gh release edit "$RELEASE_TAG" --draft=false \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify immutable release and automatic attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          wheel="dist/proofstate-${version}-py3-none-any.whl"
          sdist="dist/proofstate-${version}.tar.gz"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          release_json="$RUNNER_TEMP/proofstate-release.json"
          attestation_json="$RUNNER_TEMP/proofstate-release-attestation.json"
          tag_ref_json="$RUNNER_TEMP/proofstate-tag-ref.json"
          tag_object_json="$RUNNER_TEMP/proofstate-tag-object.json"
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --format json > "$attestation_json"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$tag_ref_json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$tag_object_json"
          gh release verify-asset "$RELEASE_TAG" "$wheel" \
            --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$sdist" \
            --repo "$GITHUB_REPOSITORY"
          for artifact in "$wheel" "$sdist"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --limit 5
          done
          python3 scripts/verify_published_release.py \
            --release-json "$release_json" \
            --attestation-json "$attestation_json" \
            --tag-ref-json "$tag_ref_json" \
            --tag-object-json "$tag_object_json" \
            --tag "$RELEASE_TAG" \
            --tag-object "$tag_object" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --dist dist
