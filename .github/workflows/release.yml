name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.5
        required: true
        type: string
      confirm:
        description: Confirm creation of a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Validate and create GitHub release
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate source and tests
        run: |
          python3 scripts/verify_release.py --tag "$RELEASE_TAG"
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/proofstate tests
          uv run pytest --cov=proofstate --cov-report=term-missing
          python3 scripts/check_repository.py
      - name: Build distributions
        run: make build
      - name: Verify release artifact versions
        run: python3 scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify both installed distributions
        run: |
          uv venv --python 3.11 wheel-env
          uv pip install --python wheel-env/bin/python dist/proofstate-*.whl
          wheel-env/bin/proofstate --version
          wheel-env/bin/proofstate conformance
          wheel-env/bin/proofstate conformance --export wheel-conformance
          uv venv --python 3.11 sdist-env
          uv pip install --python sdist-env/bin/python dist/proofstate-*.tar.gz
          sdist-env/bin/proofstate --version
          sdist-env/bin/proofstate conformance
          sdist-env/bin/proofstate conformance --export sdist-conformance
      - name: Create release without publishing packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "ProofState $version" \
            --notes-file "$notes"
