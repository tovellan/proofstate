name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      confirm:
        description: Confirm creation of a public GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Validate and create GitHub release
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate source and tests
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/proofstate tests
          uv run pytest --cov=proofstate --cov-report=term-missing
          python3 scripts/check_repository.py
      - name: Build distributions
        run: make build
      - name: Verify installed conformance bundle
        run: |
          uv venv --python 3.11 release-env
          uv pip install --python release-env/bin/python dist/proofstate-*.whl
          release-env/bin/proofstate conformance
      - name: Create release without publishing packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          notes_file="docs/release-notes/$version.md"
          test -f "$notes_file"
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "ProofState $version" \
            --notes-file "$notes_file"
