name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/proofstate tests
      - name: Test
        run: uv run pytest --cov=proofstate --cov-report=term-missing
      - name: Run executable example
        run: uv run python examples/basic/run.py

  package:
    name: Build and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.11 clean-env
          uv pip install --python clean-env/bin/python dist/proofstate-*.whl
          clean-env/bin/proofstate --version
          clean-env/bin/python examples/basic/run.py
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  repository-gate:
    name: Repository policy and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check tracked repository content
        run: python3 scripts/check_repository.py
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
      - name: Audit runtime dependencies
        run: uv run pip-audit --requirement runtime-requirements.txt --disable-pip --require-hashes
