name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight source tree
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_distribution.py --source-only
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/proofstate tests
      - name: Test
        run: uv run pytest --cov=proofstate --cov-report=term-missing
      - name: Run executable example
        run: uv run python examples/basic/run.py

  package:
    name: Build and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight source tree
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_distribution.py --source-only
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: false
      - name: Build distributions
        run: make build
      - name: Install wheel and source archive in clean environments
        run: |
          uv venv --python 3.11 wheel-env
          uv pip install --python wheel-env/bin/python dist/proofstate-*.whl
          wheel-env/bin/proofstate --version
          wheel-env/bin/proofstate conformance
          wheel-env/bin/proofstate conformance --export wheel-conformance
          wheel-env/bin/python examples/basic/run.py
          uv venv --python 3.11 sdist-env
          uv pip install --python sdist-env/bin/python dist/proofstate-*.tar.gz
          sdist-env/bin/proofstate --version
          sdist-env/bin/proofstate conformance
          sdist-env/bin/proofstate conformance --export sdist-conformance
          sdist-env/bin/python examples/basic/run.py
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  repository-gate:
    name: Repository policy and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight source tree
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_distribution.py --source-only
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
      - name: Audit runtime dependencies
        run: uv run pip-audit --requirement runtime-requirements.txt --disable-pip --require-hashes
